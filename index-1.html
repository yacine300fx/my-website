<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yacine Glass Calculator</title>
<meta name="description" content="Yacine Glass Calculator — حساب سعر الزجاج بالسنتيمتر والمجموع بالدينار.">
<meta name="theme-color" content="#0e6b5c">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230E6B5C'/%3E%3Crect x='8.5' y='5.5' width='15' height='21' rx='1.2' fill='%23EEF3F0'/%3E%3Cpath d='M10.2 7.4h7.2L10.2 16.6V7.4z' fill='%238A6A2F'/%3E%3Crect x='8.5' y='5.5' width='15' height='21' rx='1.2' fill='none' stroke='%23132019' stroke-width='1.4'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,640&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#eef3f0;--surface:#fff;--ink:#132019;--muted:#3e524a;--line:#d5e0da;--primary:#0e6b5c;--primary-ink:#f4fbf8;--brass:#8a6a2f;--brass-soft:#f6f0e2;--danger:#9b2c2c;--danger-soft:#fdecec;--shadow:0 1px 2px rgb(19 32 25/.05),0 10px 28px rgb(19 32 25/.05)}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;min-height:100vh;text-rendering:optimizeLegibility}
button{font:inherit;cursor:pointer;color:inherit;background:none;border:0}
input{font:inherit;color:var(--ink)}
svg{width:1rem;height:1rem;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.num{font-variant-numeric:tabular-nums}
.bar{height:4px;background:var(--primary)}
header{background:var(--surface);border-bottom:1px solid var(--line)}
.wrap{max-width:48rem;margin:0 auto;padding:0 1rem}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:.75rem;padding-block:1rem}
.brand{display:flex;align-items:center;gap:.75rem;min-width:0}
.logo{width:3rem;height:3rem;flex:none;display:grid;place-items:center;border-radius:1rem;background:var(--primary);color:var(--primary-ink);box-shadow:var(--shadow)}
.logo svg{width:1.75rem;height:1.75rem;stroke-width:1.7}
.brand b{display:block;font:560 1.4rem/1 Fraunces,"IBM Plex Sans Arabic",serif;letter-spacing:-.01em}
.brand small{display:block;margin-top:.25rem;font-size:.875rem;color:var(--muted)}
.lang{display:flex;flex:none;padding:.25rem;border:1px solid var(--line);border-radius:.75rem;background:var(--bg)}
.lang button{height:2.5rem;padding:0 .75rem;border-radius:.5rem;font-size:.875rem;font-weight:600;color:var(--muted)}
.lang button.on{background:var(--primary);color:var(--primary-ink)}
main{max-width:48rem;margin:0 auto;padding:1.25rem 1rem 11rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:1rem;padding:1rem;box-shadow:var(--shadow)}
.lbl{display:block;margin-bottom:.375rem;font-size:.75rem;font-weight:500;color:var(--muted)}
.inp{width:100%;height:3rem;padding:0 .75rem;border:1px solid var(--line);border-radius:.75rem;background:var(--bg);font-size:1rem;outline:0}
.inp::placeholder{color:rgb(62 82 74/.6);font-weight:400}
.inp:focus,.qty:focus-within{border-color:var(--primary);box-shadow:0 0 0 2px rgb(14 107 92/.25)}
.inp.c{text-align:center;font-weight:600}
.hint{margin-top:.75rem;font-size:.75rem;line-height:1.6;color:var(--muted)}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;margin-top:.75rem}
.btn{display:inline-flex;align-items:center;gap:.5rem;height:2.75rem;padding:0 .75rem;border:1px solid var(--line);border-radius:.75rem;background:var(--surface);font-size:.875rem;font-weight:600;text-decoration:none;color:var(--ink)}
.btn.p{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.d{border-color:transparent;background:none;color:var(--danger)}
.ask{display:inline-flex;align-items:center;gap:.5rem;height:2.75rem;padding:0 .5rem;border-radius:.75rem;background:var(--danger-soft);color:var(--danger);font-size:.875rem}
.ask button{font-weight:600}
.ask .y{text-decoration:underline}
.memo{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.5rem;margin-top:1rem;padding:.5rem .75rem;border-radius:.75rem;background:var(--brass-soft);color:var(--brass);font-size:.875rem}
.memo button{font-weight:600;text-decoration:underline}
#panes{display:flex;flex-direction:column;gap:.75rem;margin-top:1rem}
.pane{animation:rise .18s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.ph{display:flex;align-items:flex-start;justify-content:space-between;gap:.75rem;margin-bottom:.75rem}
.ph p{font-size:.875rem;font-weight:600}
.ph .tot{margin-top:.25rem;font-size:1.5rem;font-weight:600;color:var(--primary)}
.ph .tot small{font-size:.875rem;font-weight:500;color:var(--muted)}
.ph .ar{font-size:.75rem;color:var(--muted)}
.acts{display:flex;gap:.5rem}
.ic{width:2.75rem;height:2.75rem;display:grid;place-items:center;border:1px solid var(--line);border-radius:.75rem}
.ic.d{background:var(--danger-soft);border-color:transparent;color:var(--danger)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;margin-top:.75rem}
@media(min-width:640px){.grid{grid-template-columns:repeat(4,1fr)}}
.qty{display:flex;height:3rem;overflow:hidden;border:1px solid var(--line);border-radius:.75rem;background:var(--bg)}
.qty button{width:2.75rem;flex:none;display:grid;place-items:center}
.qty input{width:100%;min-width:0;border:0;background:none;text-align:center;font-weight:600;font-size:1rem;outline:0}
footer{position:fixed;inset:auto 0 0 0;z-index:20;background:rgb(255 255 255/.95);backdrop-filter:blur(4px);border-top:1px solid var(--line)}
footer .wrap{display:flex;align-items:flex-end;justify-content:space-between;gap:.75rem;padding-top:.75rem;padding-bottom:max(.75rem,env(safe-area-inset-bottom))}
footer small{font-size:.75rem;font-weight:500;color:var(--muted)}
#grand{font-size:1.875rem;line-height:1;font-weight:600;margin:.125rem 0}
#sub{font-size:.875rem;color:var(--muted)}
.hide{display:none!important}
::selection{background:#cfe6df}
@media print{.np{display:none!important}body,html{background:#fff}main{padding-bottom:1rem}}
</style>
</head>
<body>
<div class="bar"></div>
<header>
  <div class="wrap">
    <div class="brand">
      <span class="logo"><svg viewBox="0 0 32 32"><rect x="5" y="8" width="14" height="18" rx="1.5" fill="currentColor" opacity=".35" stroke="none"/><rect x="12" y="5" width="15" height="18" rx="1.5"/><path d="M14 9.5h9" stroke-width="1.2" opacity=".7"/></svg></span>
      <div><b>Yacine Glass</b><small id="subtitle"></small></div>
    </div>
    <div class="lang np" role="group">
      <button data-lang="ar">عربي</button><button data-lang="en">EN</button>
    </div>
  </div>
</header>

<main>
  <section class="card">
    <label><span class="lbl" id="t-customer"></span><input class="inp" id="customer" autocomplete="off"></label>
    <p class="hint" id="t-formula"></p>
  </section>

  <div class="tools np">
    <button class="btn" id="copy"></button>
    <a class="btn p" id="wa" target="_blank" rel="noreferrer"></a>
    <button class="btn" id="print"><svg viewBox="0 0 24 24"><path d="M6 9V3h12v6M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="7"/></svg><span id="t-print"></span></button>
    <button class="btn d" id="clear"></button>
    <span class="ask hide" id="ask"><span id="t-ask"></span><button class="y" id="yes"></button><button id="no"></button></span>
  </div>

  <div class="memo hide" id="memo">
    <span><span id="t-rem"></span>: <b class="num" id="memo-price"></b></span>
    <button id="apply"></button>
  </div>

  <div id="panes"></div>
</main>

<footer class="np">
  <div class="wrap">
    <div>
      <small id="t-grand"></small>
      <p id="grand" class="num">0.00</p>
      <p id="sub" class="num"></p>
    </div>
    <button class="btn p" id="add" style="height:3rem;padding:0 1rem"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span id="t-add"></span></button>
  </div>
</footer>

<script>
const KEY = "yacine-glass-quote-v1";
const T = {
  ar:{subtitle:"حاسبة سعر الزجاج",customer:"اسم الزبون",customerPh:"اختياري — يظهر في العرض",piece:"زجاجة",kind:"النوع",kindPh:"سكوريت، مرايا…",length:"الطول",width:"العرض",qty:"العدد",price:"سعر المتر",cm:"سم",m2:"م²",currency:"دينار",area:"المساحة",grand:"المجموع الكلي",pieces:"قطع",add:"إضافة زجاجة",duplicate:"نسخ القطعة",remove:"حذف",less:"إنقاص العدد",more:"زيادة العدد",clear:"مسح الكل",clearAsk:"مسح العرض؟",yes:"نعم، امسح",no:"إلغاء",copy:"نسخ العرض",copied:"تم النسخ",whatsapp:"واتساب",print:"طباعة",apply:"تطبيق سعر المتر على الكل",remembered:"الزجاجة الجديدة تأخذ سعر المتر",formula:"السعر = الطول × العرض × العدد × سعر المتر ÷ 10000"},
  en:{subtitle:"Glass price calculator",customer:"Customer",customerPh:"Optional — shown on the quote",piece:"Pane",kind:"Type",kindPh:"Tempered, mirror…",length:"Length",width:"Width",qty:"Qty",price:"Price / m²",cm:"cm",m2:"m²",currency:"dinar",area:"Area",grand:"Grand total",pieces:"pieces",add:"Add pane",duplicate:"Duplicate pane",remove:"Remove",less:"Decrease quantity",more:"Increase quantity",clear:"Clear all",clearAsk:"Clear this quote?",yes:"Yes, clear",no:"Cancel",copy:"Copy quote",copied:"Copied",whatsapp:"WhatsApp",print:"Print",apply:"Apply meter price to all",remembered:"New panes use meter price",formula:"Price = length × width × qty × price per m² ÷ 10000"}
};
const $ = id => document.getElementById(id);
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : "pane-" + Date.now() + Math.random());
const newPane = (price = "") => ({id: uid(), length: "", width: "", qty: "1", price, kind: ""});
const num = v => { const n = parseFloat(String(v).replace(",", ".")); return Number.isFinite(n) && n >= 0 ? n : 0; };
const clean = raw => { const c = raw.replace(/,/g, ".").replace(/[^\d.]/g, ""), d = c.indexOf("."); return d < 0 ? c : c.slice(0, d + 1) + c.slice(d + 1).replace(/\./g, ""); };
const area = p => num(p.length) * num(p.width) * num(p.qty) / 10000;
const total = p => area(p) * num(p.price);
const money = n => n.toFixed(2);
const bump = (q, d) => { const n = Math.max(0, num(q) + d); return Number.isInteger(n) ? String(n) : String(Math.round(n * 100) / 100); };

let state = {panes: [newPane()], customer: "", lastPrice: "", lang: "ar"};
try {
  const s = JSON.parse(localStorage.getItem(KEY));
  if (s && Array.isArray(s.panes) && s.panes.length) {
    state = {
      panes: s.panes.filter(p => p && p.id).map(p => ({id: p.id, length: String(p.length ?? ""), width: String(p.width ?? ""), qty: String(p.qty ?? "1"), price: String(p.price ?? ""), kind: String(p.kind ?? "")})),
      customer: s.customer || "", lastPrice: s.lastPrice || "", lang: s.lang === "en" ? "en" : "ar"
    };
    if (!state.panes.length) state.panes = [newPane()];
  }
} catch (e) {}

const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };
const t = () => T[state.lang];

function buildQuote() {
  const L = t(), out = ["Yacine Glass Calculator"];
  if (state.customer.trim()) out.push(`${L.customer}: ${state.customer.trim()}`);
  out.push("");
  state.panes.forEach((p, i) => {
    const size = `${num(p.length)} × ${num(p.width)} ${L.cm} × ${num(p.qty)}`;
    out.push(`${i + 1}. ${p.kind.trim() ? size + " · " + p.kind.trim() : size} — ${money(total(p))} ${L.currency}`);
  });
  out.push("", `${L.grand}: ${money(state.panes.reduce((s, p) => s + total(p), 0))} ${L.currency}`,
    `${L.area}: ${money(state.panes.reduce((s, p) => s + area(p), 0))} ${L.m2}`);
  return out.join("\n");
}

const ICONS = {
  copy: '<svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',
  check: '<svg viewBox="0 0 24 24" style="color:var(--primary)"><path d="M20 6 9 17l-5-5"/></svg>',
  trash: '<svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>',
  minus: '<svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg>',
  plus: '<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>'
};

function field(key, label, cls = "") {
  return `<label class="${cls}"><span class="lbl">${label}</span><input class="inp c" data-k="${key}" inputmode="decimal" autocomplete="off"></label>`;
}

// Rebuilds the pane cards (only when structure/language changes, so typing never loses focus)
function renderPanes() {
  const L = t(), box = $("panes");
  box.innerHTML = "";
  state.panes.forEach((p, i) => {
    const el = document.createElement("article");
    el.className = "card pane";
    el.dataset.id = p.id;
    el.innerHTML = `
      <div class="ph">
        <div>
          <p>${L.piece} ${i + 1}</p>
          <p class="tot num"><span class="lt"></span> <small>${L.currency}</small></p>
          <p class="ar num"><span class="la"></span> ${L.m2}</p>
        </div>
        <div class="acts np">
          <button class="ic" data-a="dup" aria-label="${L.duplicate}">${ICONS.copy}</button>
          <button class="ic d" data-a="del" aria-label="${L.remove}">${ICONS.trash}</button>
        </div>
      </div>
      <label><span class="lbl">${L.kind}</span><input class="inp" data-k="kind" placeholder="${L.kindPh}" autocomplete="off" style="text-align:start"></label>
      <div class="grid">
        ${field("length", `${L.length} (${L.cm})`)}
        ${field("width", `${L.width} (${L.cm})`)}
        <label><span class="lbl">${L.qty}</span>
          <div class="qty">
            <button type="button" data-a="less" aria-label="${L.less}">${ICONS.minus}</button>
            <input data-k="qty" inputmode="decimal" autocomplete="off">
            <button type="button" data-a="more" aria-label="${L.more}">${ICONS.plus}</button>
          </div>
        </label>
        ${field("price", L.price)}
      </div>`;
    el.querySelectorAll("[data-k]").forEach(inp => inp.value = p[inp.dataset.k]);
    box.appendChild(el);
  });
  updateTotals();
}

// Updates numbers only (no DOM rebuild)
function updateTotals() {
  const L = t();
  document.querySelectorAll(".pane").forEach(el => {
    const p = state.panes.find(x => x.id === el.dataset.id);
    if (!p) return;
    el.querySelector(".lt").textContent = money(total(p));
    el.querySelector(".la").textContent = money(area(p));
  });
  const grand = state.panes.reduce((s, p) => s + total(p), 0);
  const ar = state.panes.reduce((s, p) => s + area(p), 0);
  const pcs = state.panes.reduce((s, p) => s + num(p.qty), 0);
  $("grand").textContent = money(grand);
  $("sub").textContent = `${L.currency} · ${money(ar)} ${L.m2} · ${pcs} ${L.pieces}`;
  $("memo").classList.toggle("hide", !state.lastPrice);
  $("memo-price").textContent = state.lastPrice;
  $("apply").classList.toggle("hide", state.panes.length < 2);
  $("wa").href = "https://wa.me/?text=" + encodeURIComponent(buildQuote());
  save();
}

function applyLang() {
  const L = t();
  document.documentElement.lang = state.lang;
  document.documentElement.dir = state.lang === "ar" ? "rtl" : "ltr";
  document.querySelectorAll(".lang button").forEach(b => b.classList.toggle("on", b.dataset.lang === state.lang));
  $("subtitle").textContent = L.subtitle;
  $("t-customer").textContent = L.customer;
  $("customer").placeholder = L.customerPh;
  $("t-formula").textContent = L.formula;
  $("copy").innerHTML = ICONS.copy + L.copy;
  $("wa").textContent = L.whatsapp;
  $("t-print").textContent = L.print;
  $("clear").textContent = L.clear;
  $("t-ask").textContent = L.clearAsk;
  $("yes").textContent = L.yes;
  $("no").textContent = L.no;
  $("t-rem").textContent = L.remembered;
  $("apply").textContent = L.apply;
  $("t-grand").textContent = L.grand;
  $("t-add").textContent = L.add;
  renderPanes();
}

// ---- Events ----
$("customer").value = state.customer;
$("customer").addEventListener("input", e => { state.customer = e.target.value; updateTotals(); });

document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => { state.lang = b.dataset.lang; applyLang(); }));

$("panes").addEventListener("input", e => {
  const k = e.target.dataset.k, id = e.target.closest(".pane")?.dataset.id;
  const p = state.panes.find(x => x.id === id);
  if (!k || !p) return;
  if (k !== "kind") { const v = clean(e.target.value); if (v !== e.target.value) e.target.value = v; p[k] = v; }
  else p[k] = e.target.value;
  if (k === "price") state.lastPrice = p.price;
  updateTotals();
});

$("panes").addEventListener("click", e => {
  const btn = e.target.closest("[data-a]");
  if (!btn) return;
  const id = btn.closest(".pane").dataset.id, i = state.panes.findIndex(x => x.id === id), p = state.panes[i];
  const a = btn.dataset.a;
  if (a === "less" || a === "more") {
    p.qty = bump(p.qty, a === "more" ? 1 : -1);
    btn.closest(".pane").querySelector('[data-k="qty"]').value = p.qty;
    updateTotals();
  } else if (a === "dup") {
    state.panes.splice(i + 1, 0, {...p, id: uid()}); renderPanes();
  } else if (a === "del") {
    state.panes.splice(i, 1);
    if (!state.panes.length) state.panes = [newPane(state.lastPrice)];
    renderPanes();
  }
});

$("add").addEventListener("click", () => {
  $("ask").classList.add("hide"); $("clear").classList.remove("hide");
  state.panes.push(newPane(state.lastPrice)); renderPanes();
  window.scrollTo({top: document.body.scrollHeight, behavior: "smooth"});
});

$("apply").addEventListener("click", () => { state.panes.forEach(p => p.price = state.lastPrice); renderPanes(); });

$("copy").addEventListener("click", async () => {
  const text = buildQuote();
  try { await navigator.clipboard.writeText(text); }
  catch (e) { const a = document.createElement("textarea"); a.value = text; document.body.appendChild(a); a.select(); document.execCommand("copy"); a.remove(); }
  $("copy").innerHTML = ICONS.check + t().copied;
  setTimeout(() => $("copy").innerHTML = ICONS.copy + t().copy, 1800);
});

$("print").addEventListener("click", () => window.print());

const askToggle = on => { $("ask").classList.toggle("hide", !on); $("clear").classList.toggle("hide", on); };
$("clear").addEventListener("click", () => askToggle(true));
$("no").addEventListener("click", () => askToggle(false));
$("yes").addEventListener("click", () => {
  state = {panes: [newPane()], customer: "", lastPrice: "", lang: state.lang};
  $("customer").value = ""; askToggle(false); renderPanes();
});

applyLang();
</script>
</body>
</html>
